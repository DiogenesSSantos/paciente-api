name: CI CD via SSH

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven

      - name: Build Application JAR
        run: mvn clean package -DskipTests

      - name: Docker Compose Build
        run: docker compose build

      - name: Tag and push images
        run: |
          docker tag ${{ secrets.IMAGE_NAME }}:latest ${{ secrets.IMAGE_NAME }}:${{ github.run_id }}
          docker push ${{ secrets.IMAGE_NAME }}:${{ github.run_id }}
          docker push ${{ secrets.IMAGE_NAME }}:latest

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # login no Docker Hub (necessário se a VPS precisa puxar imagem privada)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # pull da imagem com tag imutável
            docker pull ${{ secrets.IMAGE_NAME }}:${{ github.run_id }} || true

            # atualizar o deployment para a tag específica
            kubectl set image deployment/${{ secrets.DEPLOYMENT_NAME }} ${{ secrets.CONTAINER_NAME }}=${{ secrets.IMAGE_NAME }}:${{ github.run_id }} -n default

            # aguardar rollout
            kubectl rollout status deployment/${{ secrets.DEPLOYMENT_NAME }} -n default



